<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <link rel='stylesheet' type='text/css'  href='style.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <script src='main.js'></script>
</head>
<body>
    <div class="app-layout">
        <header>
            <h1>Contact form</h1>
            <nav>
                <ul class="menu">
                    <li><a href="index.html#about" class="selector">About Me</a></li>
                    <li><a href="index.html#projects" class="selector">Projects</a></li>
                    <li><a href="index.html#skills" class="selector">Skills</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <form method="POST" id="contact-form">
                <section class="form-section" id="section-greeting">
                    <label for="greeting">Greeting:</label>
                    <select name="greeting" id="user-greeting">
                        <option value="mr">Mr.</option>
                        <option value="mrs">Mrs.</option>
                        <option value="ms">Miss</option>
                    </select>
                </section>
                <section class="form-section" id="section-name">
                    <label for="user-name">Your name:</label>
                    <input type="text" name="name" id="user-name">
                </section>
                <section class="form-section" id="section-surname">
                    <label for="user-surname">Your surname:</label>
                    <input type="text" name="surname" id="user-surname">
                </section>
                <section class="form-section" id="section-email">
                    <label for="user-email">Your email:</label>
                    <input type="text" name="email" id="user-email" pattern="^[^\s@]+@[^\s@]+\.[^\s@]{2,}$">
                </section>
                <section class="form-section" id="section-phone">
                    <label for="user-phone">Your phone number:</label>
                    <input type="text" name="phone" id="user-phone" pattern="^\+?[0-9]{1,3}[\s\-]?\(?[0-9]{1,4}\)?([\s\-]?[0-9]{2,4}){2,4}$">
                </section>
                <section class="form-section" id="section-wayofcontact">
                    <p>Preferable way of contact:</p>
                    <input type="radio" id="user-contact-email" name="contact-way" value="email">
                    <label for="user-contact-email">Email</label>
                    <input type="radio" id="user-contact-phone" name="contact-way" value="phone">
                    <label for="user-contact-phone">Phone</label>
                </section>
                <section class="form-section" id="section-message">
                    <label for="contact-message">Your message:</label>
                    <br>
                    <textarea name="message" id="contact-message" rows="5" cols="40">Write your message here...</textarea>
                </section>
                <section class="form-section" id="section-submit">
                    <input type="submit" name="action" value="Send">
                </section>
            </form>
        </main>
        <footer>
            <p>Made by Oleg Bukhtoiarov</p>
            <p>2026, Berlin</p>
        </footer>
    </div>
</body>
</html>
